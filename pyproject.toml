[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hipaa-audit-assistant"
version = "0.1.0"
description = "RAG assistant that audits a security policy against HIPAA Security Rule controls, with verified evidence quotes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rahul Phull" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "numpy>=1.26",
  "anthropic>=0.40",
]

[project.optional-dependencies]
# Dense embeddings (BAAI/bge-small-en-v1.5). Without it the app falls back to a hashing embedder.
embeddings = ["fastembed>=0.3"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
hipaa-audit = "hipaa_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hipaa_audit = ["catalog/data/*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
