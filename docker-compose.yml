# docker compose up --build
# Then open http://localhost:8000. Settings come from .env (copy .env.example); without one the server starts but cannot review
# anything until a model backend is configured.
services:
  app:
    build: .
    image: hipaa-audit-assistant:local
    # Loopback only. Put an authenticating proxy in front, or set HIPAA_AUDIT_API_KEY, before exposing it to a network.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false # needs Docker Compose 2.24 or later
    volumes:
      - audit-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  audit-data:
