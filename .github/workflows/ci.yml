name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v

  interface:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  browser:
    name: Browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the server
        run: pip install -e .
      - name: Install the interface and a browser
        working-directory: ui
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Drive the interface against the server
        working-directory: ui
        run: npm run e2e
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t hipaa-audit-assistant:ci .
      - name: The catalog and the sample policy are in the image
        run: |
          docker run --rm hipaa-audit-assistant:ci controls | head -3
          docker run --rm hipaa-audit-assistant:ci audit /app/examples/sample_policy.md --backend heuristic -q | head -5
      - name: Start the server offline and check that it answers
        run: |
          docker run -d --name app -p 8000:8000 -e HIPAA_AUDIT_LLM_BACKEND=heuristic hipaa-audit-assistant:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/ | grep -q "HIPAA policy review"
      - name: Server log
        if: always()
        run: docker logs app || true
